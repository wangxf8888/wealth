<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日双报告 - AIWealth</title>
<style>
:root { --bg:#0a0e17; --bg2:#111726; --border:#1a2436; --gold:#d4a534;
        --text:#dfe6f2; --text2:#8b98ad; --text3:#5a6478; --mono:'SF Mono',Consolas,monospace; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size:14px; }
.header { display:flex; justify-content:space-between; align-items:center;
          padding:14px 24px; border-bottom:1px solid var(--border); background:var(--bg2); }
.header h1 { font-size:18px; font-weight:700; color:var(--gold); }
.header a { color:var(--text2); text-decoration:none; font-size:13px; padding:6px 12px; border-radius:6px; }
.header a:hover { color:var(--gold); background:rgba(212,165,52,0.1); }
.layout { display:flex; height:calc(100vh - 53px); }
.sidebar { width:230px; border-right:1px solid var(--border); overflow-y:auto; background:var(--bg2); padding:10px 0; }
.file-item { padding:9px 18px; cursor:pointer; color:var(--text2); font-size:13px; font-family:var(--mono); }
.file-item:hover { color:var(--text); background:rgba(56,182,255,0.05); }
.file-item.active { color:var(--gold); background:rgba(212,165,52,0.08); border-right:2px solid var(--gold); }
.file-item .tag { font-size:11px; margin-left:6px; padding:1px 6px; border-radius:4px; }
.tag.plan { background:rgba(56,182,255,0.15); color:#38b6ff; }
.tag.review { background:rgba(82,196,120,0.15); color:#52c478; }
.content { flex:1; overflow-y:auto; padding:24px 36px; max-width:1000px; }
.content h1 { font-size:22px; color:var(--gold); margin:12px 0 16px; }
.content h2 { font-size:17px; color:var(--text); margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.content h3 { font-size:15px; color:#38b6ff; margin:16px 0 8px; }
.content p, .content li { line-height:1.7; color:var(--text2); margin:4px 0; }
.content li { margin-left:22px; }
.content blockquote { border-left:3px solid var(--gold); padding:6px 14px; margin:10px 0;
                      background:rgba(212,165,52,0.05); color:var(--text3); font-size:13px; }
.content table { border-collapse:collapse; margin:10px 0; font-size:12.5px; width:100%; }
.content th { background:rgba(26,36,54,0.8); color:var(--text3); padding:8px 10px; text-align:left; font-weight:600; }
.content td { padding:7px 10px; border-bottom:1px solid rgba(26,36,54,0.5); font-family:var(--mono); color:var(--text2); }
.content tr:hover td { background:rgba(56,182,255,0.03); }
.content code { background:rgba(26,36,54,0.8); padding:2px 6px; border-radius:4px;
                font-family:var(--mono); font-size:12px; color:#e8a87c; }
.content strong { color:var(--text); }
.empty { color:var(--text3); text-align:center; margin-top:80px; }
</style>
</head>
<body>
<div class="header">
  <h1>📋 每日双报告 <span style="font-size:12px;color:var(--text3);font-weight:300">晚间复盘 + 早间计划 (Task#72)</span></h1>
  <a href="/">← 返回信号面板</a>
</div>
<div class="layout">
  <div class="sidebar" id="fileList"><div class="empty">加载中...</div></div>
  <div class="content" id="content"><div class="empty">← 选择左侧报告查看</div></div>
</div>
<script>
function fmtName(f) {
  const d = f.slice(0,4)+'-'+f.slice(4,6)+'-'+f.slice(6,8);
  const isPlan = f.includes('_plan');
  const bt = f.includes('_bt') ? ' (回测)' : '';
  return {date:d, label:(isPlan?'计划':'复盘')+bt, cls:isPlan?'plan':'review'};
}
// 极简markdown渲染(仅覆盖报告用到的语法)
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
function renderMd(md){
  const lines = md.split('\n'); let html='', inTable=false;
  for (let i=0;i<lines.length;i++){
    const ln = lines[i];
    if (/^\|/.test(ln)) {
      if (/^\|[\s\-|:]+\|$/.test(ln)) continue; // 分隔行
      const cells = ln.split('|').slice(1,-1).map(c=>inline(c.trim()));
      const isHead = !inTable;
      if (!inTable){ html+='<table>'; inTable=true; }
      const tag = isHead?'th':'td';
      html += '<tr>'+cells.map(c=>`<${tag}>${c}</${tag}>`).join('')+'</tr>';
      continue;
    }
    if (inTable){ html+='</table>'; inTable=false; }
    if (/^### /.test(ln)) html+='<h3>'+inline(ln.slice(4))+'</h3>';
    else if (/^## /.test(ln)) html+='<h2>'+inline(ln.slice(3))+'</h2>';
    else if (/^# /.test(ln)) html+='<h1>'+inline(ln.slice(2))+'</h1>';
    else if (/^> /.test(ln)) html+='<blockquote>'+inline(ln.slice(2))+'</blockquote>';
    else if (/^[-*] /.test(ln)) html+='<li>'+inline(ln.slice(2))+'</li>';
    else if (/^\s+- /.test(ln)) html+='<li style="margin-left:40px">'+inline(ln.trim().slice(2))+'</li>';
    else if (ln.trim()==='') html+='';
    else html+='<p>'+inline(ln)+'</p>';
  }
  if (inTable) html+='</table>';
  return html;
}
async function loadFile(f, el){
  document.querySelectorAll('.file-item').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  const r = await fetch('/reports/'+f);
  document.getElementById('content').innerHTML = r.ok ? renderMd(await r.text())
    : '<div class="empty">加载失败 '+r.status+'</div>';
}
(async ()=>{
  const box = document.getElementById('fileList');
  try {
    const idx = await (await fetch('/reports/index.json?t='+Date.now())).json();
    const files = (idx.files||[]).filter(f=>/^\d{8}_(plan|review)/.test(f));
    if (!files.length){ box.innerHTML='<div class="empty">暂无报告</div>'; return; }
    box.innerHTML='';
    files.forEach((f,i)=>{
      const m = fmtName(f);
      const div = document.createElement('div');
      div.className='file-item';
      div.innerHTML = m.date+'<span class="tag '+m.cls+'">'+m.label+'</span>';
      div.onclick = ()=>loadFile(f, div);
      box.appendChild(div);
      if (i===0) loadFile(f, div);
    });
  } catch(e){ box.innerHTML='<div class="empty">index.json加载失败</div>'; }
})();
</script>
</body>
</html>
